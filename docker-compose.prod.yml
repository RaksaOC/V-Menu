# Production (M4): pulls prebuilt images from GHCR instead of building.
#   TAG=<git sha or version> docker compose -f docker-compose.prod.yml up -d
#
# Database: by default the services use whatever MONGODB_URI their services/<name>/.env
# holds, for example MongoDB Atlas. To run MongoDB in a container on the same host instead,
# point each MONGODB_URI at mongodb://mongo:27017/vmenu_<x> and add --profile mongo:
#   TAG=... docker compose -f docker-compose.prod.yml --profile mongo up -d
# Atlas or container is still to be decided with M4.

x-service: &service
  restart: unless-stopped
  networks: [backend, frontend]
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.50"

services:
  mongo:
    image: mongo:7
    profiles: [mongo]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

  # No depends_on mongo: it may be Atlas. A service that cannot reach the database exits
  # and "restart: unless-stopped" brings it back until it can.
  restaurant-service:
    <<: *service
    image: ghcr.io/raksaoc/vmenu-restaurant-service:${TAG:?set TAG to the image tag}
    env_file: ./services/restaurant-service/.env

  menu-service:
    <<: *service
    image: ghcr.io/raksaoc/vmenu-menu-service:${TAG:?set TAG to the image tag}
    env_file: ./services/menu-service/.env
    environment:
      RESTAURANT_SERVICE_URL: http://restaurant-service:4101

  order-service:
    <<: *service
    image: ghcr.io/raksaoc/vmenu-order-service:${TAG:?set TAG to the image tag}
    env_file: ./services/order-service/.env
    environment:
      RESTAURANT_SERVICE_URL: http://restaurant-service:4101
      MENU_SERVICE_URL: http://menu-service:4102

  # The image must be built with the Compose DNS names as service URLs (the frontend
  # Dockerfile's defaults) and the NEXT_PUBLIC_FIREBASE_* build args.
  frontend:
    image: ghcr.io/raksaoc/vmenu-frontend:${TAG:?set TAG to the image tag}
    restart: unless-stopped
    networks: [frontend]
    ports:
      - "3400:3400"
    depends_on:
      restaurant-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

networks:
  backend:
  frontend:

volumes:
  mongo-data:
