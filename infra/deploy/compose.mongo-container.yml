# MONGO_MODE=container: MongoDB already runs in its own Docker container on the server.
# The services join that container's network (MONGO_NETWORK in .env) and use its name as
# the host, so each MONGODB_URI looks like
#   mongodb://USER:PASSWORD@<mongo container name>:27017/vmenu_staging_orders?authSource=admin

services:
  restaurant-service:
    networks: [mongo]
  menu-service:
    networks: [mongo]
  order-service:
    networks: [mongo]

networks:
  mongo:
    external: true
    name: ${MONGO_NETWORK:?set MONGO_NETWORK to the network of the Mongo container}
