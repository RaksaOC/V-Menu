# Local full stack: MongoDB, MinIO (menu photos, PHOTOS-S3), the three services and the frontend.
# Run from the repo root. Paths below are relative to this file (infra/compose/), and
# --env-file .env passes the root .env (Firebase web config) to the frontend build.
# With `export COMPOSE_FILE=infra/compose/docker-compose.yml` the -f part can be left out.
#   docker compose --env-file .env -f infra/compose/docker-compose.yml up --build -d   build and start (http://localhost:3400)
#   docker compose -f infra/compose/docker-compose.yml ps           status; all 6 should show (healthy)
#   docker compose -f infra/compose/docker-compose.yml up -d minio  only MinIO, for `npm run dev` (photos)
#   docker compose -f infra/compose/docker-compose.yml logs -f      follow every container's logs
#   docker compose -f infra/compose/docker-compose.yml down         stop (the mongo-data volume keeps the data)
#   docker compose -f infra/compose/docker-compose.yml exec restaurant-service node dist/seed.js   demo restaurant
#   docker compose -f infra/compose/docker-compose.yml exec menu-service node dist/seed.js         demo tables and dishes
# The npm scripts (npm run docker:up / docker:down / docker:logs / docker:seed) are shortcuts
# for the same commands.

# The project name used to come from the repo folder; keep it, so containers, networks and
# the mongo-data volume keep their names now that this file lives in infra/compose/.
# COMPOSE_PROJECT_NAME or -p still override it (CI uses vmenu).
name: v-menu

x-service: &service
  restart: unless-stopped
  networks: [backend, frontend]

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PHOTOS-S3: menu photos. S3-compatible object storage; the browser uploads photos straight to
  # it with a form menu-service signs, and loads them from it with signed links. Its S3 port is
  # published on 127.0.0.1 for that (S3_PORT, default 9400). Local and CI only: the credentials
  # below are not secret. menu-service makes the bucket and its clean-up rule at startup.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z # minio/minio is no longer published on Docker Hub
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: vmenu-local
      MINIO_ROOT_PASSWORD: vmenu-local-only
    ports:
      - "127.0.0.1:${S3_PORT:-9400}:9000"
    volumes:
      - minio-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  restaurant-service:
    <<: *service
    build:
      context: ../../backend
      dockerfile: services/restaurant/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file: ../../backend/services/restaurant/.env
    environment: # replaces the 127.0.0.1 addresses in .env
      MONGODB_URI: mongodb://mongo:27017/vmenu_restaurants
    depends_on:
      mongo:
        condition: service_healthy

  menu-service:
    <<: *service
    build:
      context: ../../backend
      dockerfile: services/menu/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file: ../../backend/services/menu/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/vmenu_menu
      RESTAURANT_SERVICE_URL: http://restaurant-service:4101
      ORDER_SERVICE_URL: http://order-service:4103 # VM-15
      # PHOTOS-S3: the service reaches MinIO inside the network; browsers on the published port
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:${S3_PORT:-9400}
      S3_ACCESS_KEY: vmenu-local
      S3_SECRET_KEY: vmenu-local-only
      S3_BUCKET: vmenu-photos
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy

  order-service:
    <<: *service
    build:
      context: ../../backend
      dockerfile: services/order/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file: ../../backend/services/order/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/vmenu_orders
      RESTAURANT_SERVICE_URL: http://restaurant-service:4101
      MENU_SERVICE_URL: http://menu-service:4102
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      # the repo root, so the image can see backend/packages/contracts (CL-05)
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
        # B6: set only by scripts/ci-env.sh (e2e runs against the Auth emulator)
        NEXT_PUBLIC_E2E: ${NEXT_PUBLIC_E2E:-}
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL:-}
        # rewrites are fixed at build time, so these must be the Compose DNS names
        RESTAURANT_SERVICE_URL: http://restaurant-service:4101
        MENU_SERVICE_URL: http://menu-service:4102
        ORDER_SERVICE_URL: http://order-service:4103
        # PHOTOS-S3: the CSP lets the browser post photos to MinIO and load them from it
        S3_PUBLIC_URL: http://localhost:${S3_PORT:-9400}
    restart: unless-stopped
    networks: [frontend]
    ports:
      - "3400:3400"
    depends_on:
      restaurant-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

  # B6: the Firebase Auth emulator, for e2e sign-ins (CI). Only with `--profile e2e`
  # (COMPOSE_PROFILES=e2e), so a normal `docker compose up` never starts it.
  auth-emulator:
    image: node:22-alpine
    profiles: [e2e]
    working_dir: /emulator
    command: ["npx", "-y", "firebase-tools@15.34.2", "emulators:start", "--only", "auth", "--project", "demo-vmenu"]
    environment:
      CI: "true" # no prompts
    volumes:
      - ../firebase-emulator/firebase.json:/emulator/firebase.json:ro
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:9099:9099" # the browser in the e2e job signs in here
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9099/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

networks:
  backend:
  frontend:

volumes:
  mongo-data:
  minio-data:
