name: Start the V-Menu stack
description: >
  Builds the four images from infra/compose/docker-compose.yml with Docker layer caching (GitHub Actions
  cache), starts the stack with dummy-secret .env files, MinIO for menu photos (PHOTOS-S3) and the
  Firebase Auth emulator (B6), waits for every healthcheck and seeds the demo restaurant. Used by
  the integration and e2e jobs.

runs:
  using: composite
  steps:
    - name: Write CI .env files from .env.example (dummy secrets)
      shell: bash
      run: |
        bash infra/checks/ci-env.sh
        # Same values for bake (build args) and compose; fixed project name = fixed image names.
        grep '^NEXT_PUBLIC_' .env >> "$GITHUB_ENV"
        # PHOTOS-S3: MinIO's published port, for compose and the frontend build's CSP
        grep '^S3_PORT=' .env >> "$GITHUB_ENV"
        echo "COMPOSE_PROJECT_NAME=vmenu" >> "$GITHUB_ENV"
        # B6: also start the Firebase Auth emulator; staff sign-ins in e2e go there
        echo "COMPOSE_PROFILES=e2e" >> "$GITHUB_ENV"
        # Every later `docker compose` call in the job (ps, logs, exec, down) uses this file.
        echo "COMPOSE_FILE=$GITHUB_WORKSPACE/infra/compose/docker-compose.yml" >> "$GITHUB_ENV"
        echo "GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@v4

    # `docker compose build` cannot use the GitHub Actions cache, so bake builds the same
    # compose targets with a gha cache per image, and compose then runs them with --no-build.
    - name: Build images (cached)
      uses: docker/bake-action@v7
      with:
        # A local source makes Bake run from that folder, so the compose file's relative
        # build contexts (../../backend/...) mean the same to Bake as to docker compose.
        source: infra/compose
        files: docker-compose.yml
        load: true
        set: |
          restaurant-service.tags=vmenu-restaurant-service
          restaurant-service.cache-from=type=gha,scope=restaurant-service
          restaurant-service.cache-to=type=gha,mode=max,scope=restaurant-service
          menu-service.tags=vmenu-menu-service
          menu-service.cache-from=type=gha,scope=menu-service
          menu-service.cache-to=type=gha,mode=max,scope=menu-service
          order-service.tags=vmenu-order-service
          order-service.cache-from=type=gha,scope=order-service
          order-service.cache-to=type=gha,mode=max,scope=order-service
          frontend.tags=vmenu-frontend
          frontend.cache-from=type=gha,scope=frontend
          frontend.cache-to=type=gha,mode=max,scope=frontend

    - name: Start and wait for every healthcheck
      shell: bash
      run: docker compose up -d --no-build --wait --wait-timeout 180

    # PHOTOS-S3: menu-service is ready only once it reaches MinIO (its /ready checks storage)
    - name: Photo storage is reachable
      shell: bash
      run: |
        docker compose exec -T menu-service wget -qO- http://127.0.0.1:4102/ready
        curl -fsS "http://localhost:${S3_PORT}/minio/health/ready"

    - name: Seed the demo restaurant, tables and dishes
      shell: bash
      run: |
        docker compose exec -T restaurant-service node dist/seed.js
        docker compose exec -T menu-service node dist/seed.js
