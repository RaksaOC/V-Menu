# Weekly dependency PRs. Minor and patch updates are grouped into one PR per folder so
# CI runs once per group instead of once per package. npm major versions are ignored.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      # backend/ is one workspace (CL-02): the services and packages/common share its lockfile.
      - /backend
      - /frontend
      - /e2e
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (Next 16, TypeScript 7, Firebase 13...) need code changes and failed CI
    # as plain bumps, so they are done by hand as planned work. Security updates still come.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/start-stack
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfiles (node:22-alpine, node:26-slim)
  - package-ecosystem: docker
    directories:
      - /backend/services/restaurant
      - /backend/services/menu
      - /backend/services/order
      - /frontend
    schedule:
      interval: weekly
