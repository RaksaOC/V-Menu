# Deploy V-Menu to staging or production. The pipeline is the only thing that touches the server.
#
# Called by release.yml once the images are in GHCR (it passes tag: sha-<7 chars>):
#   push to staging -> staging environment, image sha-<7>
#   push to main    -> production, image sha-<7>. Only the repo owner can update main, and
#                      only the repo owner can start a production deploy (checked below).
# Also called by rollback.yml, and can be run by hand from the Actions tab.
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag (sha-<7 chars> from release.yml). Empty with rollback.
        type: string
        default: ""
      environment:
        description: staging or production. Empty = from the git ref (main -> staging, v* tag -> production).
        type: string
        default: ""
      rollback:
        description: Go back to the previous tag instead of deploying.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: "Image tag, e.g. sha-1a2b3c4 or 1.2.0"
        type: string
        required: true
      seed:
        description: Load the demo restaurant afterwards (staging only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment != '' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }})
    runs-on: ubuntu-latest
    timeout-minutes: 25 # pull + start (up to 5 min) + auto-rollback (up to 5 min) on a slow server
    # Never two deploys to the same environment at once; a newer one waits, it does not cancel.
    concurrency:
      group: deploy-${{ inputs.environment != '' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment != '' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      url: ${{ vars.PUBLIC_URL }}
    # For the post-deploy checks of staging (B7).
    outputs:
      environment: ${{ steps.done.outputs.environment }}
      url: ${{ steps.done.outputs.url }}
    # Secrets and variables come from the GitHub Environment (staging or production).
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      MONGODB_URI_RESTAURANT: ${{ secrets.MONGODB_URI_RESTAURANT }}
      MONGODB_URI_MENU: ${{ secrets.MONGODB_URI_MENU }}
      MONGODB_URI_ORDER: ${{ secrets.MONGODB_URI_ORDER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
      MONGO_MODE: ${{ vars.MONGO_MODE }}
      MONGO_NETWORK: ${{ vars.MONGO_NETWORK }}
      PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
      # PHOTOS-S3: menu photos in object storage (MinIO)
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      STORAGE_NETWORK: ${{ vars.STORAGE_NETWORK }}
    steps:
      # Production is the owner's call: main only takes the owner's pushes and merges (repo
      # ruleset), and a hand-run Deploy/Rollback to production must come from the owner too.
      - name: Production is owner-only
        if: (inputs.environment != '' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging')) == 'production' && github.triggering_actor != github.repository_owner
        run: |
          echo "::error::Only ${{ github.repository_owner }} can deploy to production (started by ${{ github.triggering_actor }})."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the DORA lead time needs the commits this deploy ships

      - name: Work out what to deploy
        id: plan
        env:
          ENVIRONMENT: ${{ inputs.environment != '' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
          INPUT_TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ inputs.rollback }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$ENVIRONMENT" in
            staging) target=staging ;;
            production) target=prod ;;
            *) echo "::error::environment must be staging or production"; exit 1 ;;
          esac
          short=${GITHUB_SHA::7}
          expected=""
          if [[ "$ROLLBACK" == "true" ]]; then
            action=--rollback
          elif [[ "$target" == "prod" && "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9] && ( -z "$INPUT_TAG" || "$INPUT_TAG" == "sha-$short" ) ]]; then
            # A release: run the version tag (v1.2.0 -> 1.2.0, as docker/metadata-action names it).
            # It is the same image as sha-<short>, just easier to read on the server.
            action=${REF_NAME#v}
            expected=$GITHUB_SHA
          elif [[ -n "$INPUT_TAG" ]]; then
            action=$INPUT_TAG
            # Only when the tag is this commit's own image can /version be checked.
            if [[ "$INPUT_TAG" == "sha-$short" ]]; then expected=$GITHUB_SHA; fi
          else
            action=sha-$short          # docker/metadata-action type=sha: sha-<7 chars>
            expected=$GITHUB_SHA
          fi
          {
            echo "target=$target"
            echo "action=$action"
            echo "expected=$expected"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying '$action' to $target"

      - name: Deploy
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          DEPLOY_ACTION: ${{ steps.plan.outputs.action }}
          EXPECTED_SHA: ${{ steps.plan.outputs.expected }}
        run: bash infra/deploy/ci-deploy.sh

      - name: Load demo data
        if: inputs.seed && inputs.environment == 'staging'
        env:
          TARGET: staging
          DEPLOY_ACTION: --seed
        run: bash infra/deploy/ci-deploy.sh

      - name: Deployed
        id: done
        env:
          ENVIRONMENT: ${{ inputs.environment != '' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          # No URL when ci-deploy.sh skipped (no server configured yet): nothing to test then.
          if [[ -n "$SSH_HOST" ]]; then echo "url=$URL" >> "$GITHUB_OUTPUT"; fi

  # B7: test staging after every staging deploy (not after a rollback, never production).
  # Absorbs SEC-09's ZAP job and SEC-02's header check. In order:
  #   1. demo data: demo-bistro, its dishes and table T1 exist (fails with how to load them);
  #   2. security headers on the landing, a customer page and the staff logins (SEC-02);
  #   3. a short browser suite (e2e specs tagged @post-deploy): a customer orders at the demo
  #      table, the kitchen API sees it, then the test order is cancelled;
  #   4. the passive OWASP ZAP baseline (SEC-09): spider plus passive checks only, no attacks.
  #      Fails on a High alert that isn't in .zap/known-high.txt; reports kept as an artifact.
  # Every check runs even if an earlier one failed. Any failure fails this run, and the
  # post-deploy-failed job below records it on the server so the "Deploy failed" alert fires.
  post-deploy:
    name: post-deploy checks (staging)
    needs: deploy
    if: needs.deploy.outputs.environment == 'staging' && needs.deploy.outputs.url != '' && !inputs.rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For JWT_SECRET (step "Staff tokens" only). No server secrets are used in this job.
    environment: staging
    env:
      TARGET: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Short-lived (10 min) chef and cashier tokens for the demo restaurant, as its seeded owner
      # (SEC-03: the only user the seed gives those roles), so the checks can read T1's QR link
      # (SEC-04), read the kitchen queue and cancel their test order. Only this step sees JWT_SECRET.
      - name: Staff tokens
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          for role in chef cashier; do
            token=$(node scripts/staff-token.mjs "$role")
            echo "::add-mask::$token"
            echo "${role^^}_TOKEN=$token" >> "$GITHUB_ENV"
          done

      # Reads T1's QR link token with CASHIER_TOKEN: links by table name are off on the servers.
      - name: Demo data
        id: demo
        if: '!cancelled()'
        run: node scripts/check-demo-data.mjs "$TARGET"

      # SEC-02: the pages must send the security headers (landing, a customer page, staff logins).
      - name: Security headers
        if: '!cancelled()'
        run: node scripts/check-headers.mjs "$TARGET" / /demo-bistro/customer/T1 /owner/login /demo-bistro/cashier/login

      - name: Install the browser tests
        if: steps.demo.outcome == 'success' && !cancelled()
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Skipped without the demo data: the check above already says what's missing.
      - name: Browser tests (@post-deploy)
        if: steps.demo.outcome == 'success' && !cancelled()
        working-directory: e2e
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          CI: "true"
        run: npx playwright test --grep @post-deploy

      - name: Scan (passive checks only)
        if: '!cancelled()'
        run: |
          mkdir -p zap && chmod 777 zap
          # -I: don't fail on warnings here; the summary step below decides. -m 3: spider 3 minutes.
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET" -m 3 -I -J report.json -r report.html -w report.md

      - name: Security summary
        if: '!cancelled()'
        run: node scripts/security-summary.mjs zap zap/report.json --label staging --known .zap/known-high.txt --fail-on-high

      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: post-deploy
          path: |
            zap/
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # B7: a failed post-deploy check goes into staging's deploy-history.log as
  # "post-deploy-check <tag> failed". The monitoring agent ships that line to Grafana, and the
  # "Deploy failed" alert fires. Staging keeps running the new version: this is a signal for a
  # person, not an automatic rollback.
  post-deploy-failed:
    name: record failed post-deploy checks
    needs: [deploy, post-deploy]
    if: always() && needs.post-deploy.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.SSH_PORT }}
    steps:
      - uses: actions/checkout@v7

      - name: Record it in the deploy history
        env:
          TARGET: staging
          DEPLOY_ACTION: --check-failed
        run: bash infra/deploy/ci-deploy.sh
