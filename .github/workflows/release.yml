name: Release

# Every push to main and every v* tag builds the four images, pushes them to GHCR, scans
# them, then hands the immutable sha- tag to the deploy workflow.
#   push to main   -> sha-<7 chars>, main
#   tag v1.2.0     -> sha-<7 chars>, 1.2.0, latest
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never stop a half-pushed release

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.v.outputs.owner }}
      sha_tag: ${{ steps.v.outputs.sha_tag }}
    steps:
      - id: v
        run: |
          # GHCR names must be lowercase (RaksaOC -> raksaoc)
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  images:
    name: image (${{ matrix.name }})
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: restaurant-service, context: services/restaurant-service }
          - { name: menu-service, context: services/menu-service }
          - { name: order-service, context: services/order-service }
          - { name: frontend, context: frontend }
    env:
      # Same names docker-compose.prod.yml pulls.
      IMAGE: ghcr.io/${{ needs.meta.outputs.owner }}/vmenu-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The services ignore the NEXT_PUBLIC_* args; the frontend bakes them into the
          # browser bundle. They are public Firebase web config, kept as repository Variables.
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Fails the release (and so blocks deploy) on a fixable HIGH or CRITICAL CVE.
      # Pinned to a commit: this action's tags have been force-pushed before.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.meta.outputs.sha_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [meta, images]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.meta.outputs.sha_tag }}
    secrets: inherit
