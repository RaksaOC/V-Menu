# Read-only filter in front of the Docker socket. Everything not listed here gets a 403:
# no creating, starting or exec-ing containers, and no copying files out of them.
#
# Known limit: container inspect (".../json") is needed for logs and also returns each
# container's environment variables, so this filter does not hide those from Alloy.

global
    maxconn 64

defaults
    mode http
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    timeout tunnel 24h

frontend docker_api
    bind :2375
    http-request deny deny_status 403 unless METH_GET
    acl read_only_path path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events|networks|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|stats))$
    http-request deny deny_status 403 unless read_only_path
    default_backend docker_socket

backend docker_socket
    server docker unix@/var/run/docker.sock
