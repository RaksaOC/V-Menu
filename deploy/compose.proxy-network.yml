# Optional (PROXY_NETWORK set): the server already runs a reverse proxy in Docker (e.g. Traefik),
# so Caddy is not installed. The frontend also joins that proxy's network, and the proxy reaches
# it by container name: vmenu-staging-frontend-1:3400 / vmenu-prod-frontend-1:3400.
# Only the frontend joins; the services stay on the stack's own networks.

services:
  frontend:
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the reverse proxy's Docker network}
